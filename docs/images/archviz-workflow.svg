<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title">
  <title id="title">建筑效果图工作流程</title>
  <rect width="1120" height="850" fill="#FFFFFF"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif">
    <text x="72" y="79" fill="#182438" font-size="39" font-weight="700">建筑效果图工作流程</text>
    <text x="72" y="123" fill="#526279" font-size="21">从装饰施工图和 SketchUp 模型，到受控生图与交付</text>
    <g text-anchor="middle">
    <rect x="72" y="151" width="976" height="87" rx="19" fill="#F5F7FA" stroke="#E5EAF1"/>
    <text x="560" y="188" fill="#182438" font-size="27" font-weight="700">G1–G2  核验底图与白模</text>
    <text x="560" y="220" fill="#526279" font-size="22">核对图纸、墙柱门窗和空间尺寸，复用已核验的模型</text>
    <path d="M560 245v15m-6-6 6 6 6-6" fill="none" stroke="#7D90A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="267" width="976" height="87" rx="19" fill="#F5F7FA" stroke="#E5EAF1"/>
    <text x="560" y="304" fill="#182438" font-size="27" font-weight="700">G3–G4  装修建模与家具样本绑定</text>
    <text x="560" y="336" fill="#526279" font-size="22">锁定 A 级构件，按真实规格简化 B 级家具并关联产品图</text>
    <path d="M560 361v15m-6-6 6 6 6-6" fill="none" stroke="#7D90A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="383" width="976" height="87" rx="19" fill="#EDF4FF" stroke="#CADEFA"/>
    <text x="560" y="420" fill="#254E83" font-size="27" font-weight="700">G5  固定相机并制作同机位索引</text>
    <text x="560" y="452" fill="#526279" font-size="22">以同一机位输出原始截图、编号图和索引卡</text>
    <path d="M560 477v15m-6-6 6 6 6-6" fill="none" stroke="#7D90A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="499" width="976" height="87" rx="19" fill="#EDF4FF" stroke="#CADEFA"/>
    <text x="560" y="536" fill="#254E83" font-size="27" font-weight="700">AI 受控生图</text>
    <text x="560" y="568" fill="#526279" font-size="22">提交原始截图、索引和实际产品图片，保持已确认的设计</text>
    <path d="M560 593v15m-6-6 6 6 6-6" fill="none" stroke="#7D90A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="615" width="976" height="87" rx="19" fill="#F5F7FA" stroke="#E5EAF1"/>
    <text x="560" y="652" fill="#182438" font-size="27" font-weight="700">模型与效果图对照验收</text>
    <text x="560" y="684" fill="#526279" font-size="22">核对几何、材料、家具型号、数量和位置</text>
    <path d="M560 709v15m-6-6 6 6 6-6" fill="none" stroke="#7D90A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="731" width="976" height="87" rx="19" fill="#F5F7FA" stroke="#E5EAF1"/>
    <text x="560" y="768" fill="#182438" font-size="27" font-weight="700">交付与归档</text>
    <text x="560" y="800" fill="#526279" font-size="22">保存效果图、机位资料与验收记录</text>
    </g>
  </g>
</svg>
